name: Release

on:
  push:
    tags: ["v*"]
  # Lancement manuel : compile et teste sans publier.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Même base que Bazzite (Fedora) : glibc et bibliothèques identiques.
    container: fedora:44
    steps:
      - name: Dépendances
        run: dnf install -y --setopt=install_weak_deps=False git gcc rust cargo pkgconf-pkg-config fontconfig tar gzip findutils

      - uses: actions/checkout@v4

      - name: Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à Cargo.toml ($v)"; exit 1; }

      - name: Tests
        run: cargo test --workspace --release

      - name: Archive
        run: packaging/package.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: noosfin-x86_64
          path: dist/noosfin-x86_64.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/noosfin-x86_64.tar.gz
          generate_release_notes: true
