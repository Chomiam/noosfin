[package]
name = "noosfin"
version = "0.2.1"
edition = "2024"
description = "Tableau de bord HTPC (KWin HDR) : Plasma, Steam Gamescope et médiathèque Jellyfin/AIOStreams orientée anime"
license = "GPL-3.0-or-later"
repository = "https://github.com/Chomiam/noosfin"

[dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "fs", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
evdev = { version = "0.13", features = ["tokio"] }
dirs = "6"
urlencoding = "2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
sha1 = "0.11"
rand = "0.9"
dom_query = "0.29.0"
fancy-regex = "0.20.0"
serde_yaml = "0.9.34"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = [".", "installer"]
